title: Bulletin Board Management
intro: This video shows how to search bulletin boards, view their details and
  list settings, and create and delete a board.
sections:
  - 09-bulletin-board-management/00-intro.md
mutates: true
maskSystem: true
scenes:
  - say: Bulletin Board Management lists every bulletin board used in Dealers.
      Create boards here, then connect them to a menu in Menu Management.
    steps:
      - open: /board
      - waitFor:
          role: columnheader
          name: Board Name
      - highlight:
          target:
            role: heading
            name: Bulletin Board Management
          ms: 2000
  - say: Each row shows the board ID and name, whether it is mapped to a menu, the
      menu path, and who created and updated it, and when.
    steps:
      - highlight:
          target:
            role: columnheader
            name: Menu-Board Mapping
          ms: 1500
      - highlight:
          target:
            role: columnheader
            name: Menu Path
          ms: 1500
  - say: To search, enter a board name and click Search. You can also filter by menu
      mapping, creator or updater, date, or menu.
    steps:
      - type:
          target:
            placeholder: Please enter the board name
          text: EV Guides
      - click:
          role: button
          name: Search
          exact: true
      - pause: 2000
  - say: Click a board to open its details.
    steps:
      - click:
          role: row
          name: EV Guides
      - waitFor:
          text: Board Details
          exact: true
      - highlight:
          target:
            text: Menu Display Status
          ms: 2000
  - say: Board Details shows the board ID, dates, names in English and French, the
      admin description, and the menu it is mapped to. Use the buttons to jump
      to Manage Posts or Manage Menu.
    steps:
      - highlight:
          target:
            role: button
            name: Go to Manage Posts
          ms: 1500
      - scroll:
          role: button
          name: Go to Manage Menu
      - highlight:
          target:
            role: button
            name: Go to Manage Menu
          ms: 1500
  - say: Post Attribute Setting decides which options writers get, such as posting
      period, target audience, important notice, notification, attachments, and
      additional attributes.
    steps:
      - scroll:
          text: Post Attribute Setting
      - highlight:
          target:
            text: Post Attribute Setting
          ms: 3000
  - say: The List Setting tab controls which columns appear in the post list and in
      what order.
    steps:
      - click:
          role: tab
          name: List Setting
      - waitFor:
          text: Display Items and Order
      - highlight:
          target:
            text: Display Items and Order
          ms: 2500
  - say: To create a board, go back to the list and click New Board.
    steps:
      - open: /board
      - waitFor:
          role: columnheader
          name: Board Name
      - click:
          role: button
          name: New Board
      - waitFor:
          text: Post Attribute Setting
  - say: Enter the board name in English and French, and a description for
      administrators.
    steps:
      - type:
          target:
            placeholder: Please enter the board name. (max 50 characters)
          text: Demo Board {stamp}
      - type:
          target:
            placeholder: Veuillez saisir le nom du forum. (50 caractères max.)
          text: Forum démo {stamp}
      - type:
          target:
            placeholder: Please enter the board description. (max 200 characters)
          text: Demo board for the guide video.
  - say: Choose Enabled or Disabled for each post attribute. With Target Audience
      enabled, writers can target posts by job title, dealer group, dealer,
      zone, and district. You can also configure the Attachments attribute.
    steps:
      - scroll:
          text: "*Additional Attribute"
          exact: true
      - highlight:
          target:
            text: "*Target Audience"
            exact: true
          ms: 3000
      - highlight:
          target:
            text: "*Attachments"
            exact: true
          ms: 1500
  - say: Set Additional Attribute to Enabled to add custom fields to posts. Up to 10
      attributes can be added, and up to 5 can be in use.
    steps:
      - click:
          role: radio
          name: Enabled
          nth: 5
      - waitFor:
          text: Field Name / Display Format
      - highlight:
          target:
            text: Field Name / Display Format
          ms: 2000
  - say: Click Add, enter the field name, and choose Single selection with a
      dropdown. Add the display values with the + button. Then enter a
      description, set field attributes such as Usage Status, Required, or
      Searchable, and click Save.
    steps:
      - click:
          role: button
          name: Add
          exact: true
      - waitFor:
          text: Additional Attributes assign custom fields to a post.
      - type:
          target:
            placeholder: Field Name (eg. model)
          text: Vehicle type
      - type:
          target:
            placeholder: Nom du champ (p. ex. modèle)
          text: Type de véhicule
      - choose:
          target:
            text: Please select a display format
            exact: true
          option: Single selection(dropdowns)
      - type:
          target:
            placeholder: Display Value (eg. Red, Blue, Green...)
          text: Sedan
      - type:
          target:
            placeholder: "Valeur affichée (p. ex. : Rouge, Bleu, Vert…)"
          text: Berline
      - click:
          role: button
          name: Add
          exact: true
          within:
            role: dialog
      - type:
          target:
            placeholder: Display Value (eg. Red, Blue, Green...)
            nth: 1
          text: Hatchback
      - type:
          target:
            placeholder: "Valeur affichée (p. ex. : Rouge, Bleu, Vert…)"
            nth: 1
          text: Berline compacte
      - type:
          target:
            placeholder: Description (eg. Please select the model)
          text: Please select the vehicle type
      - type:
          target:
            placeholder: Description (p. ex., Veuillez sélectionner le modèle)
          text: Veuillez sélectionner le type de véhicule
      - highlight:
          target:
            text: Usage status
            within:
              role: dialog
          ms: 1000
      - highlight:
          target:
            text: Required Field
          ms: 1000
      - highlight:
          target:
            text: Search Filter
          ms: 1000
      - pause: 1000
      - click:
          role: button
          name: Save
          exact: true
          within:
            role: dialog
      - waitFor:
          text: Do you want to save the Additional Attribute?
      - click:
          role: button
          name: OK
          within:
            role: dialog
      - waitFor:
          text: Vehicle type
          exact: true
  - say: A single selection with radio buttons allows up to 5 display values.
    steps:
      - click:
          role: button
          name: Add
          exact: true
      - waitFor:
          text: Additional Attributes assign custom fields to a post.
      - type:
          target:
            placeholder: Field Name (eg. model)
          text: Trim
      - type:
          target:
            placeholder: Nom du champ (p. ex. modèle)
          text: Finition
      - choose:
          target:
            text: Please select a display format
            exact: true
          option: Single selection(radio buttons)
      - type:
          target:
            placeholder: Display Value (eg. Red, Blue, Green...)
            nth: 0
          text: Base
      - type:
          target:
            placeholder: "Valeur affichée (p. ex. : Rouge, Bleu, Vert…)"
            nth: 0
          text: Base
      - click:
          role: button
          name: Add
          exact: true
          within:
            role: dialog
      - type:
          target:
            placeholder: Display Value (eg. Red, Blue, Green...)
            nth: 1
          text: Premium
      - type:
          target:
            placeholder: "Valeur affichée (p. ex. : Rouge, Bleu, Vert…)"
            nth: 1
          text: Premium
      - pause: 1000
      - click:
          role: button
          name: Save
          exact: true
          within:
            role: dialog
      - waitFor:
          text: Do you want to save the Additional Attribute?
      - click:
          role: button
          name: OK
          within:
            role: dialog
      - waitFor:
          text: Trim
          exact: true
  - say: A multi-selection dropdown lets writers choose several values.
    steps:
      - click:
          role: button
          name: Add
          exact: true
      - waitFor:
          text: Additional Attributes assign custom fields to a post.
      - type:
          target:
            placeholder: Field Name (eg. model)
          text: Color
      - type:
          target:
            placeholder: Nom du champ (p. ex. modèle)
          text: Couleur
      - choose:
          target:
            text: Please select a display format
            exact: true
          option: Multi-selection(dropdowns)
      - type:
          target:
            placeholder: Display Value (eg. Red, Blue, Green...)
            nth: 0
          text: Red
      - type:
          target:
            placeholder: "Valeur affichée (p. ex. : Rouge, Bleu, Vert…)"
            nth: 0
          text: Red
      - click:
          role: button
          name: Add
          exact: true
          within:
            role: dialog
      - type:
          target:
            placeholder: Display Value (eg. Red, Blue, Green...)
            nth: 1
          text: Blue
      - type:
          target:
            placeholder: "Valeur affichée (p. ex. : Rouge, Bleu, Vert…)"
            nth: 1
          text: Blue
      - type:
          target:
            placeholder: Description (eg. Please select the model)
          text: Please select the colors
      - type:
          target:
            placeholder: Description (p. ex., Veuillez sélectionner le modèle)
          text: Veuillez sélectionner les couleurs
      - pause: 1000
      - click:
          role: button
          name: Save
          exact: true
          within:
            role: dialog
      - waitFor:
          text: Do you want to save the Additional Attribute?
      - click:
          role: button
          name: OK
          within:
            role: dialog
      - waitFor:
          text: Color
          exact: true
  - say: A period lets writers enter a start and end date. No display values are
      needed.
    steps:
      - click:
          role: button
          name: Add
          exact: true
      - waitFor:
          text: Additional Attributes assign custom fields to a post.
      - type:
          target:
            placeholder: Field Name (eg. model)
          text: Campaign Period
      - type:
          target:
            placeholder: Nom du champ (p. ex. modèle)
          text: Période de campagne
      - choose:
          target:
            text: Please select a display format
            exact: true
          option: Period(MM-DD-YYYY ~ MM-DD-YYYY) EST
      - pause: 1000
      - click:
          role: button
          name: Save
          exact: true
          within:
            role: dialog
      - waitFor:
          text: Do you want to save the Additional Attribute?
      - click:
          role: button
          name: OK
          within:
            role: dialog
      - waitFor:
          text: Campaign Period
          exact: true
  - say: An input box lets writers type free text. Enter a description, which is
      shown as a placeholder. You can also include the field in integrated
      search.
    steps:
      - click:
          role: button
          name: Add
          exact: true
      - waitFor:
          text: Additional Attributes assign custom fields to a post.
      - type:
          target:
            placeholder: Field Name (eg. model)
          text: Dealer Note
      - type:
          target:
            placeholder: Nom du champ (p. ex. modèle)
          text: Note du concessionnaire
      - choose:
          target:
            text: Please select a display format
            exact: true
          option: Input box (text)
      - type:
          target:
            role: textbox
            name: Text Field
            nth: 2
            within:
              role: dialog
          text: Enter a note for dealers
      - type:
          target:
            role: textbox
            name: Text Field
            nth: 3
            within:
              role: dialog
          text: Saisissez une note pour les concessionnaires
      - highlight:
          target:
            text: Integrated Search
            exact: true
          ms: 2000
      - pause: 1000
      - click:
          role: button
          name: Save
          exact: true
          within:
            role: dialog
      - waitFor:
          text: Do you want to save the Additional Attribute?
      - click:
          role: button
          name: OK
          within:
            role: dialog
      - waitFor:
          text: Dealer Note
          exact: true
  - say: All five attributes are listed with their display values and usage status.
    steps:
      - highlight:
          target:
            text: Field Name / Display Format
          ms: 3000
  - say: Click Save. The new board opens, not yet mapped to a menu.
    steps:
      - click:
          role: button
          name: Save
          exact: true
      - waitFor:
          text: Saved successfully
      - click:
          role: button
          name: OK
      - waitFor:
          text: Board Details
          exact: true
      - highlight:
          target:
            text: Not Visible
          ms: 2000
  - say: In List Setting, click Edit to change the columns. Drag the handles to
      reorder, and turn display on or off. Required fields cannot be hidden.
    steps:
      - click:
          role: tab
          name: List Setting
      - click:
          role: button
          name: Edit
          exact: true
      - waitFor:
          text: The visibility of these required fields cannot be modified
      - click:
          role: checkbox
          nth: 3
      - pause: 1000
  - say: Click Save to apply the list settings.
    steps:
      - click:
          role: button
          name: Save
          exact: true
      - waitFor:
          text: Bulletin Board List Items Saved
      - click:
          role: button
          name: OK
  - say: To delete a board, open Bulletin Board Details and click Delete. Deleted
      boards cannot be recovered.
    steps:
      - click:
          role: tab
          name: Bulletin Board Details
      - click:
          role: button
          name: Delete
          exact: true
      - waitFor:
          text: Are you sure you want to delete this board?
      - highlight:
          target:
            role: dialog
          ms: 2000
      - click:
          role: button
          name: Confirm
          within:
            role: dialog
      - waitFor:
          text: Deleted successfully.
      - click:
          role: button
          name: OK
