title: Menu Management
intro: This video shows how to view, search, edit, create, and delete menus, and
  how to set menu access permissions.
sections:
  - 08-menu-management/00-intro.md
scenes:
  - say: Menu Management lets you manage the menus of Kia Dealers_BO. Click Menu
      Management in the left navigation to open it.
    steps:
      - open: /dealer/company
      - waitFor:
          text: Dealer Management
      - click:
          role: link
          name: Menu Management
      - waitFor:
          text: Dealers Menu
  - say: On the left is the Dealers Menu tree. Menus can be created up to a maximum
      of 4 depths.
    steps:
      - highlight:
          target:
            text: Dealers Menu
          ms: 2500
  - say: On the right, the detail panel asks you to select a menu from the Kia
      Dealers Portal until you pick one.
    steps:
      - highlight:
          target:
            text: Please select a menu from the Kia Dealers Portal
          ms: 2500
  - say: To find a menu, type its name in the search box. Here we search for
      Incentive. Matching keywords are highlighted, and only the parent path
      remains.
    steps:
      - type:
          target:
            placeholder: Please enter the menu name
          text: Incentive
      - pause: 2500
  - say: Clear the search keyword, and the full menu tree appears again.
    steps:
      - type:
          target:
            placeholder: Please enter the menu name
          text: ""
      - pause: 1500
  - say: Select a menu to see its details. Here we select General Board - 20, under
      the new board menu.
    steps:
      - click:
          role: treeitem
          name: General Board - 20
      - waitFor:
          text: Menu Display Status
  - say: Menu Display Status shows whether the menu is currently visible. Display
      Setting is Enabled or Disabled, and it also controls the visibility of the
      submenus on the front-end screen.
    steps:
      - highlight:
          target:
            text: Menu Display Status
          ms: 2500
      - highlight:
          target:
            text: Controls the menu and submenu visibility on Front-end screen.
          ms: 2500
  - say: With Scheduled Display enabled, you can set a Display start date. The menu
      becomes visible at 00:00 EST on that date.
    steps:
      - highlight:
          target:
            text: Scheduled Display
          ms: 2500
      - highlight:
          target:
            text: The menu will become visible on the Front screen at the start of the
              selected date (00:00 EST).
          ms: 2500
  - say: Below, you can see the create and update dates, and who created and updated
      the menu, followed by the Menu Type.
    steps:
      - highlight:
          target:
            text: Create Date
          ms: 2500
      - highlight:
          target:
            text: Menu Type
          ms: 2500
  - say: Further down are the Menu Name in English and French, the Domain and Menu
      URL, the Menu Description, and the Menu Permissions List.
    steps:
      - scroll:
          text: Menu Permissions List
      - highlight:
          target:
            text: Menu Permissions List
          ms: 2500
  - say: To change a menu, click Edit at the bottom.
    steps:
      - click:
          role: button
          name: Edit
      - waitFor:
          text: Domain Setting
  - say: Display Setting, Scheduled Display, Menu Type, Menu-Board Mapping, Domain
      Setting, descriptions, and permissions can now be edited. Changing the
      menu type resets the existing input, so a confirmation message appears
      first.
    steps:
      - highlight:
          target:
            text: Menu Type
          ms: 3000
  - say: Click Domain Setting to open the Domain List, with each domain, its SSO
      callback path, and its linked menus.
    steps:
      - click:
          role: button
          name: Domain Setting
      - waitFor:
          text: Domain List
  - say: Use Add at the top right to add a domain. A domain that has linked menus
      cannot be deleted. Click Cancel to close the popup.
    steps:
      - highlight:
          target:
            role: button
            name: Add
          ms: 2500
      - click:
          role: button
          name: Cancel
  - say: In the Menu Permissions List, click Add to define a permission for this
      menu. Choose Access or Read, and enter the description in English and
      French, up to 200 characters.
    steps:
      - click:
          role: button
          name: Add
          nth: 1
      - waitFor:
          text: Add Menu Permission
      - highlight:
          target:
            text: Permission Description
          ms: 3000
  - say: Cancel the popup, and then cancel the edit if you do not want to save.
      Saving shows a confirmation and applies the change.
    steps:
      - click:
          role: button
          name: Cancel
      - highlight:
          target:
            role: button
            name: Save
          ms: 2500
      - click:
          role: button
          name: Cancel
      - waitFor:
          text: Menu Details
  - say: Next, open the Menu Access Permission tab to set who can access this menu.
    steps:
      - click:
          role: tab
          name: Menu Access Permission
      - waitFor:
          text: Job title
  - say: Click Edit to open the Menu Access Permission popup. Search for a Job
      title, then set All, Access, or Read with the checkboxes.
    steps:
      - click:
          role: button
          name: Edit
      - waitFor:
          text: Job Title Permission
      - highlight:
          target:
            role: table
          ms: 3000
  - say: Only Job titles with access to the parent menu are listed. To assign
      others, use the parent menu or Job Management first. Click Cancel to
      close.
    steps:
      - highlight:
          target:
            text: To assign access to users or job titles that do not currently have
              permission
          ms: 3000
      - click:
          role: button
          name: Cancel
  - say: Note the order. If a menu has no permissions defined, such as Product,
      clicking Edit here shows an Add Menu Permission notice. So define the menu
      permissions in Menu Details first, then grant access here.
    steps:
      - click:
          role: treeitem
          name: Product
          nth: 1
      - waitFor:
          text: Menu Details
      - click:
          role: tab
          name: Menu Access Permission
      - click:
          role: button
          name: Edit
      - waitFor:
          text: Add Menu Permission
      - highlight:
          target:
            role: button
            name: Go to Setting
          ms: 2500
      - click:
          role: button
          name: Later
  - say: To create a top-level group, click Group Addition at the top of the tree.
      For a submenu, hover over a tree node and click Add Submenu.
    steps:
      - open: /menu
      - waitFor:
          text: Dealers Menu
      - click:
          role: button
          name: Group Addition
      - waitFor:
          text: Display Setting
  - say: A creation form opens on the right with only the Menu Details tab. Fill in
      the display settings, menu type, names, domain, URL, description, and
      permissions, then click Save. After saving, continue with the access
      permission setting.
    steps:
      - highlight:
          target:
            text: Display Setting
          ms: 3000
  - say: To delete a menu, hover over a tree node and click Delete Menu. A menu with
      submenus cannot be deleted until the submenus are removed. Otherwise a
      Delete This Menu confirmation appears.
    steps:
      - open: /menu
      - waitFor:
          text: Dealers Menu
      - highlight:
          target:
            role: tree
          ms: 2500
