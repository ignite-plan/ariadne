title: Menu Management
intro: This video shows how to manage menus, including creating, viewing,
  editing, and deleting menus in Hyundai Dealers_BO.
section: 08-menu-management/00-intro.md
mutates: true
maskPersonal: true
scenes:
  - say: Menu Management lets you manage menus within Hyundai Dealers_BO by
      creating, editing, and deleting menus. Menus can be created up to a
      maximum of 4 depths.
    steps:
      - open: /menu
      - waitFor:
          text: Dealers Menu
  - say: You can select a menu type to configure it according to its publishing
      purpose. There are 3 menu types, General, Bulletin board, and Outlink,
      used to create menus that direct to Link pages, Bulletin board menus, or
      External links.
    steps:
      - click:
          role: treeitem
          name: eComposite
      - waitFor:
          text: Menu Details
  - say: Menu access permissions allow you to manage who can access the menu.
    steps:
      - click:
          role: tab
          name: Menu Access Permission
      - waitFor:
          text: Menu Access Permission
      - highlight:
          target:
            text: Job title
          ms: 2000
  - say: Click Edit on the Job title tab to set Access and Read permissions for a
      job title.
    steps:
      - click:
          role: tab
          name: Job title
      - click:
          role: button
          name: Edit
      - waitFor:
          role: dialog
      - click:
          role: checkbox
          name: checkbox
          nth: 14
      - pause: 1500
      - click:
          role: button
          name: Save
      - waitFor:
          role: dialog
      - click:
          role: button
          name: Confirm
