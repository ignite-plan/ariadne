title: Bulletin Board & Post Detail
intro: This video shows how to find a post in a bulletin board, read the post
  details, and view images and attachments.
sections:
  - 04-bulletin-board/00-intro.md
  - 04-bulletin-board/01-post-list.md
  - 04-bulletin-board/02-post-detail.md
maskPersonal: true
scenes:
  - say: Click a menu in the top navigation bar to open its bulletin board. The menu
      name and description appear at the top.
    steps:
      - open: /
      - waitFor:
          text: Bulletin Highlights
      - hover:
          text: Bulletin news
      - click:
          text: Bulletin news
      - waitFor:
          text: Bulletin Menu
      - highlight:
          target:
            role: heading
            name: Bulletin news
          ms: 2000
  - say: Use the search filters to find a post by Title, Keyword, or Post ID, by
      Date, or by additional attributes such as Item. The list shows the total
      number of posts, and you can sort by Date or Title; important notices are
      pinned at the top, new posts have a New flag, and hovering over an
      attachment name shows the full file name. Click a post title to open the
      post detail, which shows the title, additional information, the posting
      date in American format, Copy Link, and the content with its formatting.
    steps:
      - click:
          role: combobox
          name: Title
      - waitFor:
          role: listbox
      - pause: 1500
      - click:
          role: option
          name: Title
      - click:
          role: textbox
          name: date picker
          nth: 0
      - pause: 1500
      - click:
          role: heading
          name: Bulletin news
      - click:
          role: button
          name: 열기
      - waitFor:
