  - say: Click a post title to open the post detail. The header shows the title,
      additional information, and the posting date.
    steps:
      - open: /board/1/post/20
      - waitFor:
          role: heading
          name: EV9 Product Guide
      - highlight:
          target:
            role: heading
            name: EV9 Product Guide
          ms: 2000
      - highlight:
          target:
            text: "Bulletin Number : 2026-10-1001"
          ms: 2000
  - say: Images in the post open in the image gallery. You can download the image or
      close the gallery from the top right, and move between images with the
      thumbnails at the bottom.
    steps:
      - click:
          role: img
          name: paste-1792573411612.png
      - waitFor:
