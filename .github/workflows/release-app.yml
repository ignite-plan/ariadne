# app-v<version> 태그를 push하면 arm64 dmg를 만들어 GitHub Release에 올린다.
# 앱은 실행할 때 이 리포의 최신 app-v 릴리즈를 확인해 새 버전을 알린다
name: Release app
on:
  push:
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: brew install pandoc
      - name: 태그에서 버전 지정
        run: npm pkg set version="${GITHUB_REF_NAME#app-v}"
      - run: pnpm typecheck
      - run: pnpm test
      # 사내 자체 서명 인증서로 서명한다 (업데이트해도 macOS가 같은 앱으로 알아봐 폴더 권한이 유지된다. 키체인은 lib/keychain.ts 참고).
      # 인증서가 없으면 ad-hoc 빌드가 나가 사용자들이 권한을 다시 허용해야 하므로 릴리스를 멈춘다
      - name: 서명 인증서 준비
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ] || [ -z "$MAC_CERT_PASSWORD" ]; then
            echo "::error::MAC_CERT_P12 / MAC_CERT_PASSWORD 시크릿이 없습니다"
            exit 1
          fi
          KC="$RUNNER_TEMP/sign.keychain-db"
          KP="$(openssl rand -hex 16)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -p codesigning "$KC" | awk '/Ariadne Code Signing/ {print $2; exit}')"
          if [ -z "$ID" ]; then echo "::error::인증서에서 서명 ID를 찾지 못했습니다"; exit 1; fi
          echo "MAC_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - run: pnpm app:dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg \
            --title "Ariadne ${GITHUB_REF_NAME#app-v}" \
            --notes-file app/INSTALL.md
